[package]
name = "rust_lib_simple_live_app"
version = "0.1.0"
edition = "2021"

[lib]
# rlib 供集成测试（manual_e2e 等）链接；cargokit 的移动端构建不受影响
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
lazy_static = "1.4.0"
chrono = "0.4"
slive-core = { path = "crates/slive-core" }
slive-host = { path = "crates/slive-host" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }


[workspace]
members = ["crates/slive-core", "crates/slive-cli", "crates/slive-host", "crates/slive-ffi"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
