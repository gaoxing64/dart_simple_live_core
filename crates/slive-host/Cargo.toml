[package]
name = "slive-host"
version = "0.1.0"
edition = "2021"
description = "Simple Live 宿主层：真实连接装配 + 弹幕会话，供 CLI / FRB 桥 / C ABI 共用"
publish = false

[dependencies]
slive-core = { path = "../slive-core" }
async-trait = "0.1"
futures-util = "0.3"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# TLS 后端按平台分层（原样搬自根 Cargo.toml，ADR-013/ADR-015）：
# 桌面 native-tls —— 斗鱼弹幕服务器对 rustls ClientHello 指纹风控（2026-10-17 真机实证）；
# 移动 rustls —— 保「移动端零 OpenSSL/NDK C 依赖」。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
